<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecommerce Card</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
   <div class="products">
       <div class="container">
           <h1 class="title">Nike Shoe Store</h1>
            <p class="text-light">Nike is a global sportswear giant founded in 1964, known for footwear, apparel, and equipment.Nike is a global sportswear giant founded in 1964, known for footwear, apparel, and equipment. Its "Just Do It" slogan and swoosh logo are among the world's most recognized.</p>
            <div class="product-items">
                 <!-- First Product -->
                  <div class="product">
                       <div class="product content">
                          <div class="product-img">
                              <img src="images/shoe1.png" alt="">
                          </div>
                          <div class="product-btns">
                               <button type="button" class="btn-cart">Add To Cart
                                  <span><i class="fas fa-plus"></i></span>
                               </button>
                               <button type="button" class="btn-cart">Add To Cart
                                  <span><i class="fas fa-shopping-cart"></i></span>
                               </button>
                          </div>
                       </div>

                       <div class="product-info">
                           <div class="product-info-top">
                              <h2 class="sm-title">Nike</h2>
                           </div>
                       </div>
                  </div>
            </div>
       </div>
   </div>
  
</body>
</html>
