<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Profile Cards</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <section>
        <div class="container">

             <div class="card">
                 <div class="content">
                     <div class="img">
                         <img src="img1.jpg" alt="">
                     </div>
                     <div class="content-details">
                         <h3>Lily<br><span>Designer</span></h3>
                     </div>
                 </div>
                 <ul class="socials">
                     <li style="--i:1"><a href="#"><i class="fab fa-facebook"></i></a></li>
                     <li style="--i:2"><a href="#"><i class="fab fa-instagram"></i></a></li>
                     <li style="--i:3"><a href="#"><i class="fab fa-github"></i></a></li>
                 </ul>
             </div>

             <!-- Card-2 -->
              <div class="card">
                 <div class="content">
                     <div class="img">
                         <img src="img2.jpg" alt="">
                     </div>
                     <div class="content-details">
                         <h3>Lily<br><span>Designer</span></h3>
                     </div>
                 </div>
                 <ul class="socials">
                     <li><a href="#"><i class="fab fa-facebook"></i></a></li>
                     <li><a href="#"><i class="fab fa-instagram></i></a></li>
                     <li><a href="#"><i class="fab fa-github"></i></a></li>
                 </ul>
             </div>

             <!-- Card-3 -->
              <div class="card">
                 <div class="content">
                     <div class="img">
                         <img src="img3.jpg" alt="">
                     </div>
                     <div class="content-details">
                         <h3>Lily<br><span>Designer</span></h3>
                     </div>
                 </div>
                 <ul class="socials">
                     <li><a href="#"><i class="fab fa-facebook"></i></a></li>
                     <li><a href="#"><i class="fab fa-instagram></i></a></li>
                     <li><a href="#"><i class="fab fa-github"></i></a></li>
                 </ul>
             </div>
        </div>
    </section>
</body>
</html>
