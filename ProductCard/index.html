<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card Design</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
   <div class="main">
       <h2 class="heading">Product Cards</h2>
       <div class="container">
           <div class="card">
               <div class="image">
                    <img src="images/shoe.png" alt="">
                    <h2>Shoes</h2>
               </div>
               <div class="details">
                  <div class="price">
                      <h3>Price: </h3>
                      <p>$20 -/</p>
                  </div>
               </div>
           </div>
       </div>
   </div>
</body>
</html>
